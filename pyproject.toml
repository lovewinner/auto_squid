[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 只打包 auto_squid 主包;bench 是工具目录(压测脚本),不纳入发行包。
# setuptools 扁平布局会同时发现 bench 和 auto_squid 两个顶层包而报错,
# 需显式限定包发现范围。
[tool.setuptools.packages.find]
include = ["auto_squid*"]

[project]
name = "auto-squid"
version = "0.0.0"
description = "Design and prototype for intelligent Squid multi-proxy routing"
authors = [ { name="auto-squid" } ]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.95.0",
  "uvicorn[standard]>=0.20.0",
  "httpx>=0.24.0",
  "pydantic>=2.0",
  "typer>=0.6.0",
  "pyyaml>=6.0"
]

[project.scripts]
auto-squid = "auto_squid.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
# 只统计主包:bench/ 是压测工具、test_routing.py 是运维诊断脚本,都不纳入覆盖率分母。
source = ["auto_squid"]
# 分支覆盖:本项目条件分支密集(竞速/熔断/降级),仅行覆盖会显著高估。
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
