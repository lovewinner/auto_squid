[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-squid"
version = "0.0.0"
description = "Design and prototype for intelligent Squid multi-proxy routing"
authors = [ { name="auto-squid" } ]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.95.0",
  "uvicorn[standard]>=0.20.0",
  "httpx>=0.24.0",
  "pydantic>=2.0",
  "typer>=0.6.0",
  "pyyaml>=6.0"
]

[project.scripts]
auto-squid = "auto_squid.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
