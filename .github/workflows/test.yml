name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # uv.lock 是 git-ignored(见 .gitignore),CI 工作区无锁文件,故不能用
        # --frozen;直接 uv sync 从 pyproject.toml 解析依赖。
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
