name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        # setup-uv 的移动 major tag 只到 v7(v8/v9/v10 仅精确版本,无 vN 软链),
        # 用 @v10 会解析失败。v7 是当前最新有 vN tag 的稳定版。
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        # uv.lock 已纳入版本管理,CI 用 --frozen 锁定精确版本(可复现)。
        run: uv sync --frozen

      - name: Run tests
        # pytest-timeout:单个测试超时(60s)自动失败并报出测试名,避免 CI
        # 因某测试挂起而无限等待(本地 2.98s 全过,CI 曾卡 18 分钟)。
        run: uv run pytest -q --timeout=60
